    #hanmo-combination-sample-v1 { --paper:#e9e0cd; --ink:#252a28; --line:#b6a88e; --red:#a34435; font:400 16px/1.55 'HanmoSans', 'Noto Sans SC', sans-serif; color:var(--ink); max-width:960px; margin:0 auto; }
    #hanmo-combination-sample-v1 * { box-sizing:border-box; }
    #hanmo-combination-sample-v1 .sample-grid { display:grid; grid-template-columns:minmax(230px,1fr) minmax(280px,.95fr); gap:24px; align-items:start; }
    #hanmo-combination-sample-v1 .stage { background:var(--paper); }
    #hanmo-combination-sample-v1 canvas { display:block; max-width:100%; }
    #hanmo-combination-sample-v1 .portrait { width:100%; height:auto; }
    #hanmo-combination-sample-v1 .controls { padding:16px; background:#f4eddf; border:1px solid var(--line); }
    #hanmo-combination-sample-v1 .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    #hanmo-combination-sample-v1 label { display:block; min-width:0; }
    #hanmo-combination-sample-v1 select { display:block; width:100%; min-height:44px; padding:6px 9px; margin-top:4px; background:#fff9ed; border:1px solid var(--line); border-radius:2px; color:var(--ink); font:inherit; }
    #hanmo-combination-sample-v1 button { min-height:44px; padding:6px 12px; color:var(--ink); border:1px solid var(--line); border-radius:2px; background:#fff9ed; font:inherit; }
    #hanmo-combination-sample-v1 button:active { background:#e2d5bd; }
    #hanmo-combination-sample-v1 .actions { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    #hanmo-combination-sample-v1 .avatars { display:flex; flex-wrap:wrap; gap:18px; align-items:end; margin:18px 0 0; }
    #hanmo-combination-sample-v1 figure { margin:0; }
    #hanmo-combination-sample-v1 figcaption { text-align:center; margin-top:5px; }
    #hanmo-combination-sample-v1 .avatars canvas { background:var(--paper); border:1px solid var(--line); box-sizing:content-box; }

  <script>
    (async function () {
      const root = document.getElementById('hanmo-combination-sample-v1');
      const status = root.querySelector('[data-status]');
      const createCanvas = (width,height) => { const c=document.createElement('canvas'); c.width=width;c.height=height;return c; };
      const images = {};
      try {
        await Promise.all(Object.entries(window.HANMO_SAMPLE_TEXTURES).map(([name,source]) => new Promise((resolve,reject) => {
          const image = new Image(); image.onload=()=>{images[name]=image;resolve();}; image.onerror=()=>reject(new Error('素材载入失败：'+name)); image.src=source;
        })));
        const renderer = window.HanmoSample.makeRenderer(createCanvas,images);
        const currentShared = () => {
          const shared=window.openai && window.openai.widgetState;
          return shared && typeof shared==='object' && !Array.isArray(shared) ? shared : {};
        };
        const stored=currentShared().hanmoCharacterSample;
        let state=renderer.validState(stored && stored.version===1 ? stored.state : null);
        const portrait=root.querySelector('[data-portrait]');
        const view=root.querySelector('[data-layer]');
        const fields=Array.from(root.querySelectorAll('[data-feature]'));
        const copy=(target,source)=>{const ctx=target.getContext('2d');ctx.clearRect(0,0,target.width,target.height);ctx.drawImage(source,0,0);};
        function draw() {
          fields.forEach(field=>field.value=String(state[field.dataset.feature]));
          copy(portrait,view.value==='all'?renderer.compose(state):renderer.layer(view.value,state));
          root.querySelectorAll('[data-avatar]').forEach(c=>copy(c,renderer.avatar(state,Number(c.dataset.avatar))));
          status.textContent=view.value==='all'?'当前组合已更新':'图层保持原始位置';
          root.dataset.ready='true';
        }
        function change() {
          draw();
          if(window.openai && typeof window.openai.setWidgetState==='function') {
            Promise.resolve(window.openai.setWidgetState({...currentShared(),hanmoCharacterSample:{version:1,state:{...state}}})).catch(()=>{status.textContent='当前组合已更新，共享状态暂未保存';});
          }
        }
        fields.forEach(field=>field.addEventListener('change',()=>{state[field.dataset.feature]=Number(field.value);change();}));
        view.addEventListener('change',draw);
        root.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>{
          for(const key of ['eyes','nose','mouth'])state[key]=Number(button.dataset.preset);change();
        }));
        root.querySelector('[data-reset]').addEventListener('click',()=>{state={...renderer.manifest.defaults};view.value='all';change();});
        window.addEventListener('openai:set_globals',()=>{
          const next=currentShared().hanmoCharacterSample;
          if(next && next.version===1){state=renderer.validState(next.state);draw();}
        });
        root.__sample={renderer,getState:()=>({...state}),setState:next=>{state=renderer.validState(next);draw();}};
        draw();
      } catch(error) { status.textContent=error.message;status.classList.add('error');status.setAttribute('role','alert'); }
    })();
  </script>
